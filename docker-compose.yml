services:
  db:
    image: mysql:8.0
    container_name: liftlog-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: liftlog
      MYSQL_USER: liftloguser
      MYSQL_PASSWORD: liftlogpass
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql

  server:
    build: ./server
    container_name: liftlog-server
    depends_on:
      - db
    environment:
      # change to match your code/env usage
      DB_HOST: db
      DB_USER: liftloguser
      DB_PASSWORD: liftlogpass
      DB_NAME: liftlog
      DB_PORT: 3306
      PORT: 5000
    ports:
      - "5000:5000"

  client:
    build: ./client
    container_name: liftlog-client
    depends_on:
      - server
    ports:
      - "5173:80"
    # IMPORTANT:
    # Your React app must call the API using something like:
    # http://localhost:5000  (from your browser)
    # NOT "server:5000" (that only works container-to-container)

volumes:
  dbdata:
