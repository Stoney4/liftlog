services:
  db:
    image: mysql:8.0
    container_name: liftlog-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: liftlog
      MYSQL_USER: liftloguser
      MYSQL_PASSWORD: liftlogpass
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: liftlog-server
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: liftloguser
      DB_PASSWORD: liftlogpass
      DB_NAME: liftlog
      DB_PORT: 3306
      PORT: 3001
      # helps file-watching in Docker/Windows sometimes
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: liftlog-client
    depends_on:
      - server
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  dbdata:
